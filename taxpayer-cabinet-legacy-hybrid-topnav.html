-profile{display:flex;align-items:center;gap:10px;min-width:0}.profile-person{width:38px;height:38px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.18);font-size:13px;font-weight:700}.profile-copy strong,.profile-copy small{display:block;white-space:nowrap}.profile-copy strong{font-size:13px}.profile-copy small{margin-top:3px;color:rgba(255,255,255,.88);font-size:12px}.hybrid-frame{display:block;width:100%;height:calc(100vh - 82px);border:0;background:#f5f7fa}.loading{position:fixed;z-index:10;left:212px;right:0;top:82px;bottom:0;display:grid;place-items:center;background:#f5f7fa;color:#71819a;font-size:14px}.loading[hidden]{display:none}
